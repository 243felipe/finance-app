<section class="card-surface salaries-card">
  <div class="search-bar">
    <label for="filtro">Descrição</label>
    <div class="search-row">
      <input id="filtro" type="text" pInputText [(ngModel)]="filtroDescricao" placeholder="Buscar por colaborador" />
      <div class="actions">
        <button pButton type="button" label="Pesquisar" icon="pi pi-search" class="btn-ghost" (click)="pesquisar()"></button>
        <button pButton type="button" label="Cadastrar" icon="pi pi-plus" class="btn-primary" (click)="abrirModal()"></button>
        <button
          pButton
          type="button"
          label="Excluir"
          icon="pi pi-trash"
          class="btn-danger"
          (click)="excluir()"
          [disabled]="!selecionado || selecionado.length === 0"
        ></button>
        <button pButton type="button" label="Atualizar" icon="pi pi-refresh" class="btn-primary" (click)="carregar()"></button>
      </div>
    </div>
  </div>

  <div class="table-scroll">
    <p-table
      [value]="itensFiltrados"
      dataKey="colaborador"
      responsiveLayout="scroll"
      selectionMode="multiple"
      [(selection)]="selecionado"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 48px"></th>
          <th>Colaborador</th>
          <th>Competência</th>
          <th>Valor</th>
          <th>Tipo</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr [pSelectableRow]="item">
          <td>
            <p-tableCheckbox [value]="item"></p-tableCheckbox>
          </td>
          <td>{{ item.colaborador }}</td>
          <td>{{ item.competencia }}</td>
          <td>{{ item.valor }}</td>
          <td>{{ item.tipo }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>

<p-dialog header="Cadastrar salário" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '520px' }" [closable]="false">
  <form [formGroup]="form" class="dialog-form">
    <div class="field">
      <label for="colaborador">Colaborador</label>
      <input id="colaborador" type="text" pInputText formControlName="colaborador" />
      <small *ngIf="form.get('colaborador')?.invalid && form.get('colaborador')?.touched" class="error">
        Informe o colaborador.
      </small>
    </div>

    <div class="field">
      <label for="competencia">Competência</label>
      <input id="competencia" type="text" pInputText formControlName="competencia" placeholder="Ex.: Jan/2025" />
      <small *ngIf="form.get('competencia')?.invalid && form.get('competencia')?.touched" class="error">
        Informe a competência.
      </small>
    </div>

    <div class="field">
      <label for="valor">Valor</label>
      <input id="valor" type="text" pInputText formControlName="valor" placeholder="Ex.: R$ 8.200,00" />
      <small *ngIf="form.get('valor')?.invalid && form.get('valor')?.touched" class="error">
        Informe o valor.
      </small>
    </div>

    <div class="field">
      <label for="tipo">Tipo</label>
      <select id="tipo" formControlName="tipo" class="p-inputtext p-component">
        <option [ngValue]="null" disabled selected>Selecione</option>
        <option *ngFor="let t of tipos" [ngValue]="t.value">{{ t.label }}</option>
      </select>
      <small *ngIf="form.get('tipo')?.invalid && form.get('tipo')?.touched" class="error">Selecione um tipo.</small>
    </div>

    <div class="dialog-actions">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="dialogVisible = false"></button>
      <button pButton type="button" label="Salvar" [loading]="saving" (click)="salvar()" autofocus></button>
    </div>
  </form>
</p-dialog>
