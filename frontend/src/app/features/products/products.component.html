<section class="card-surface products-card">
  <div class="search-bar">
    <label for="filtro">Descrição</label>
    <div class="search-row">
      <input id="filtro" type="text" pInputText [(ngModel)]="filtroDescricao" placeholder="Buscar por descrição" />
      <div class="actions">
        <button pButton type="button" label="Pesquisar" icon="pi pi-search" class="btn-ghost" (click)="pesquisar()"></button>
        <button pButton type="button" label="Cadastrar" icon="pi pi-plus" class="btn-primary" (click)="abrirModal()"></button>
        <button
          pButton
          type="button"
          label="Editar"
          icon="pi pi-pencil"
          class="btn-primary"
          (click)="editar()"
          [disabled]="!selecionado || selecionado.length !== 1"
        ></button>
        <button
          pButton
          type="button"
          label="Excluir"
          icon="pi pi-trash"
          class="btn-danger"
          (click)="excluir()"
          [disabled]="!selecionado"
        ></button>
        <button pButton type="button" label="Atualizar" icon="pi pi-refresh" class="btn-primary" (click)="carregar()"></button>
      </div>
    </div>
  </div>

  <div class="table-scroll">
    <p-table
      [value]="itensFiltrados"
      dataKey="sku"
      responsiveLayout="scroll"
      selectionMode="multiple"
      [(selection)]="selecionado"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 48px"></th>
          <th>Descrição</th>
          <th>SKU</th>
          <th>Categoria</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr [pSelectableRow]="item">
          <td>
            <p-tableCheckbox [value]="item"></p-tableCheckbox>
          </td>
          <td>{{ item.descricao }}</td>
          <td>{{ item.sku }}</td>
          <td>{{ item.categoria }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>

<p-dialog header="Cadastrar item" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '480px' }" [closable]="false">
  <form [formGroup]="form" class="dialog-form">
    <div class="field">
      <label for="descricao">Descrição</label>
      <input id="descricao" type="text" pInputText formControlName="descricao" />
      <small *ngIf="form.get('descricao')?.invalid && form.get('descricao')?.touched" class="error">Informe a descrição.</small>
    </div>

    <div class="field">
      <label for="sku">SKU</label>
      <input id="sku" type="text" pInputText formControlName="sku" />
      <small *ngIf="form.get('sku')?.invalid && form.get('sku')?.touched" class="error">Informe o SKU.</small>
    </div>

    <div class="field">
      <label for="detalhe">Detalhe</label>
      <input id="detalhe" type="text" pInputText formControlName="detalhe" />
      <small *ngIf="form.get('detalhe')?.invalid && form.get('detalhe')?.touched" class="error">Informe o detalhe.</small>
    </div>

    <div class="field">
      <label for="categoria">Categoria</label>
      <select id="categoria" formControlName="categoria" class="p-inputtext p-component">
        <option [ngValue]="null" disabled selected>Selecione</option>
        <option *ngFor="let c of categorias" [ngValue]="c.value">{{ c.label }}</option>
      </select>
      <small *ngIf="form.get('categoria')?.invalid && form.get('categoria')?.touched" class="error">Selecione uma categoria.</small>
    </div>

    <div class="dialog-actions">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="dialogVisible = false"></button>
      <button pButton type="button" label="Salvar" [loading]="saving" (click)="salvar()" autofocus></button>
    </div>
  </form>
</p-dialog>
