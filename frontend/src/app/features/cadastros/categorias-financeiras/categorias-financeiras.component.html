<section class="card-surface categories-card">
  <div class="search-bar">
    <label for="filtro">Categorias Financeiras</label>
    <div class="search-row">
      <input id="filtro" type="text" pInputText [(ngModel)]="filtro" placeholder="Buscar por nome" />
      <div class="actions">
        <button pButton type="button" label="Pesquisar" icon="pi pi-search" class="btn-ghost" (click)="pesquisar()"></button>
        <button pButton type="button" label="Cadastrar" icon="pi pi-plus" class="btn-primary" (click)="abrirModal()"></button>
        <button
          pButton
          type="button"
          label="Excluir"
          icon="pi pi-trash"
          class="btn-danger"
          (click)="excluir()"
          [disabled]="!selecionado || selecionado.length === 0"
        ></button>
      </div>
    </div>
  </div>

  <div class="table-scroll">
    <p-table
      [value]="itensFiltrados"
      dataKey="id"
      responsiveLayout="scroll"
      selectionMode="multiple"
      [(selection)]="selecionado"
      [loading]="loading"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 48px"></th>
          <th>Nome</th>
          <th>Tipo</th>
          <th>Descrição</th>
          <th>Ativo</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr [pSelectableRow]="item">
          <td>
            <p-tableCheckbox [value]="item"></p-tableCheckbox>
          </td>
          <td>{{ item.nome }}</td>
          <td>{{ item.tipo === 'E' ? 'Entrada' : 'Saída' }}</td>
          <td>{{ item.descricao }}</td>
          <td>{{ item.ativo ? 'Ativo' : 'Inativo' }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>

<p-dialog header="Cadastrar categoria" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '520px' }" [closable]="false">
  <form [formGroup]="form" class="dialog-form">
    <div class="field">
      <label for="nome">Nome</label>
      <input id="nome" type="text" pInputText formControlName="nome" />
      <small *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched" class="error">
        Informe o nome.
      </small>
    </div>

    <div class="field">
      <label for="tipo">Tipo</label>
      <select id="tipo" formControlName="tipo" class="p-inputtext p-component">
        <option [ngValue]="null" disabled selected>Selecione</option>
        <option *ngFor="let t of tipos" [ngValue]="t.value">{{ t.label }}</option>
      </select>
      <small *ngIf="form.get('tipo')?.invalid && form.get('tipo')?.touched" class="error">Selecione o tipo.</small>
    </div>

    <div class="field">
      <label for="descricao">Descrição</label>
      <input id="descricao" type="text" pInputText formControlName="descricao" />
    </div>

    <div class="field checkbox-field">
      <label for="ativo">Ativo</label>
      <input id="ativo" type="checkbox" formControlName="ativo" />
    </div>

    <div class="dialog-actions">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="dialogVisible = false"></button>
      <button pButton type="button" label="Salvar" [loading]="saving" (click)="salvar()" autofocus></button>
    </div>
  </form>
</p-dialog>
