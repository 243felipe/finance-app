<div class="shell" [class.collapsed]="collapsed">
  <aside class="sidebar" [class.collapsed]="collapsed">
    <div class="brand">
      <img src="/images/logo_unica_login.png" alt="Logo" class="brand-logo" />
    </div>

    <h1 class="sidebar-title">Incret Finanças</h1>

    <nav class="menu">
      <ng-container *ngFor="let item of menu">
        <div class="menu-parent" *ngIf="item.children?.length; else singleLink">
          <div class="parent-row" (click)="toggleParent(item)">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
            <i *ngIf="!collapsed" class="pi pi-chevron-down chevron" [class.open]="expanded[item.label]"></i>
          </div>
          <div class="submenu" *ngIf="expanded[item.label] && !collapsed">
            <a
              *ngFor="let child of item.children"
              [routerLink]="child.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <i [class]="child.icon"></i>
              <span>{{ child.label }}</span>
            </a>
          </div>
        </div>
        <ng-template #singleLink>
          <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </ng-template>
      </ng-container>
    </nav>
  </aside>

  <div class="main" #mainEl>
    <header class="topbar">
      <button pButton icon="pi pi-bars" class="p-button-text" (click)="toggle()"></button>
      <div class="topbar-title">{{ title }}</div>
      <div class="tabs-container" *ngIf="tabs.length > 0">
        <div
          *ngFor="let tab of tabs"
          class="tab"
          [class.active]="isActiveTab(tab)"
          (click)="navigateToTab(tab)"
        >
          <i *ngIf="tab.icon" [class]="tab.icon" class="tab-icon"></i>
          <span class="tab-label">{{ tab.label }}</span>
          <button
            class="tab-close"
            (click)="closeTab(tab, $event)"
            type="button"
            aria-label="Fechar aba"
          >
            <i class="pi pi-times"></i>
          </button>
        </div>
      </div>
      <button
        pButton
        label="Sair"
        icon="pi pi-sign-out"
        severity="success"
        class="p-button-text logout-btn"
        (click)="logout()"
      ></button>
    </header>

    <main class="content" #contentEl>
      <router-outlet />
    </main>
  </div>
</div>
